<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedForward — Sign in</title>

    <style>
        :root {
            --navy: #161B24;
            --teal: #2C5F5F;
            --teal-2: #3A7676;
            --forest: #2E5339;
            --sage: #5C8A5C;
            --sage-2: #7BAE78;
            --ink: #F3F7F5;
            --ink-dim: rgba(243, 247, 245, 0.6);
            --glass-border: rgba(255, 255, 255, 0.22);

            font-family:
                -apple-system,
                "Segoe UI",
                "Inter",
                system-ui,
                sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;

            background:
                linear-gradient(
                    rgba(22, 27, 36, 0.72),
                    rgba(22, 27, 36, 0.72)
                ),
                url("background_img.jpeg");

            color: var(--ink);
            overflow: hidden;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        /* =====================================================
           BACKGROUND BLOBS
        ===================================================== */

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.45;
            pointer-events: none;
        }

        .blob.b1 {
            width: 420px;
            height: 420px;
            background: var(--sage);
            top: -180px;
            left: -180px;
        }

        .blob.b2 {
            width: 380px;
            height: 380px;
            background: var(--teal-2);
            right: -160px;
            bottom: -180px;
        }

        /* =====================================================
           MAIN CARD
        ===================================================== */

        .card {
            position: relative;
            z-index: 2;

            width: min(920px, 100%);
            height: 560px;

            display: grid;
            grid-template-columns: 38% 62%;

            overflow: hidden;
            border-radius: 28px;

            background: rgba(255, 255, 255, 0.055);

            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);

            border: 1px solid var(--glass-border);

            box-shadow:
                0 35px 90px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* =====================================================
           LEFT PANEL
        ===================================================== */

        .panel-left {
            position: relative;
            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    rgba(44, 95, 95, 0.72),
                    rgba(22, 27, 36, 0.72)
                );
        }

        .panel-left::after {
            content: "";

            position: absolute;
            right: -1px;
            top: 50%;

            width: 58px;
            height: 190px;

            transform: translateY(-50%);

            background: var(--teal);

            border-radius: 55px 0 0 55px;

            z-index: 2;
            opacity: 0.95;
        }

        /* Large background shape */

        .chevron-back {
            position: absolute;
            inset: -5%;

            clip-path: polygon(
                0 0,
                82% 0,
                37% 100%,
                0 100%
            );

            background:
                linear-gradient(
                    145deg,
                    rgba(123, 174, 120, 0.34),
                    rgba(92, 138, 92, 0.12)
                );

            z-index: 0;
        }

        /* Main diagonal */

        .chevron-front {
            position: absolute;
            inset: -5%;

            clip-path: polygon(
                15% 0,
                100% 0,
                53% 100%,
                -15% 100%
            );

            background:
                linear-gradient(
                    145deg,
                    rgba(46, 83, 57, 0.95),
                    rgba(44, 95, 95, 0.82)
                );

            z-index: 0;
        }

        /* Secondary diagonal */

        .panel-left::before {
            content: "";

            position: absolute;
            inset: -5%;

            clip-path: polygon(
                0 0,
                45% 0,
                100% 100%,
                68% 100%
            );

            background: rgba(123, 174, 120, 0.12);

            z-index: 0;
        }

        /* =====================================================
           BRANDING
        ===================================================== */

        .brand {
            position: absolute;
            left: 34px;
            bottom: 30px;
            z-index: 5;
        }

        .brand h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--ink);
        }

        .brand p {
            margin-top: 5px;

            font-size: 11px;
            color: rgba(243, 247, 245, 0.55);

            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* =====================================================
           LOGIN / SIGNUP TABS
        ===================================================== */

        .tabs {
            position: absolute;

            top: 50%;
            right: -1px;

            transform: translateY(-50%);

            z-index: 20;

            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .tab {
            position: relative;

            border: none;
            outline: none;
            cursor: pointer;

            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.04em;

            transition:
                background 0.25s ease,
                color 0.25s ease,
                padding 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.25s ease;
        }

        /* Active */

        .tab.active {
            min-width: 120px;

            padding: 15px 32px 15px 28px;

            background: rgba(243, 247, 245, 0.96);
            color: var(--navy);

            border-radius: 32px 0 0 32px;

            box-shadow:
                -8px 0 24px rgba(0, 0, 0, 0.18);

            z-index: 3;
        }

        .tab.active::before,
        .tab.active::after {
            content: "";

            position: absolute;
            right: 0;

            width: 24px;
            height: 24px;

            background: transparent;
            pointer-events: none;
        }

        /* Upper curve */

        .tab.active::before {
            top: -24px;

            border-radius: 0 0 24px 0;

            box-shadow:
                10px 10px 0 10px rgba(243, 247, 245, 0.96);
        }

        /* Lower curve */

        .tab.active::after {
            bottom: -24px;

            border-radius: 0 24px 0 0;

            box-shadow:
                10px -10px 0 10px rgba(243, 247, 245, 0.96);
        }

        /* Inactive */

        .tab.inactive {
            min-width: 120px;

            padding: 13px 32px 13px 28px;

            background: transparent;
            color: rgba(243, 247, 245, 0.68);

            border-radius: 30px 0 0 30px;
        }

        .tab.inactive:hover {
            color: var(--ink);
            background: rgba(255, 255, 255, 0.05);
        }

        /* =====================================================
           RIGHT PANEL
        ===================================================== */

        .panel-right {
            position: relative;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 40px 58px 0;

            background: rgba(22, 27, 36, 0.28);
        }

        /* =====================================================
           USER ICON
        ===================================================== */

        .avatar {
            width: 72px;
            height: 72px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 13px;

            background:
                linear-gradient(
                    135deg,
                    var(--sage),
                    var(--teal-2)
                );

            box-shadow:
                0 12px 30px rgba(44, 95, 95, 0.35),
                inset 0 1px 2px rgba(255, 255, 255, 0.25);
        }

        .avatar svg {
            width: 31px;
            height: 31px;
        }

        /* =====================================================
           FORMS
        ===================================================== */

        .form-block {
            display: none;

            width: 100%;
            max-width: 370px;
        }

        .form-block.active {
            display: block;

            animation:
                fadeUp 0.3s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-block h2 {
            text-align: center;

            font-size: 22px;
            font-weight: 800;

            letter-spacing: 0.05em;

            color: var(--sage-2);

            margin-bottom: 30px;
        }

        #form-signup h2 {
            margin-bottom: 22px;
        }

        /* =====================================================
           INPUT FIELDS
        ===================================================== */

        .field {
            display: flex;
            align-items: center;

            gap: 13px;

            padding: 0 4px 11px;
            margin-bottom: 25px;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.25);

            transition:
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .field:focus-within {
            border-color: var(--sage-2);
        }

        .field svg {
            width: 17px;
            height: 17px;

            flex-shrink: 0;

            color: var(--ink-dim);
        }

        .field input {
            width: 100%;

            border: 0;
            outline: 0;

            background: transparent;

            color: var(--ink);

            font-family: inherit;
            font-size: 14px;
        }

        .field input::placeholder {
            color: rgba(243, 247, 245, 0.42);
        }

        /* =====================================================
           ACTION ROW
        ===================================================== */

        .row-action {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-top: 6px;
        }

        .row-action a {
            color: var(--ink-dim);

            text-decoration: none;

            font-size: 11.5px;
        }

        .row-action a:hover {
            color: var(--sage-2);
        }

        /* =====================================================
           BUTTON
        ===================================================== */

        .btn-pill {
            border: 0;
            outline: 0;

            cursor: pointer;

            padding: 11px 27px;

            border-radius: 25px;

            background:
                linear-gradient(
                    120deg,
                    var(--sage-2),
                    var(--sage)
                );

            color: #122015;

            font-family: inherit;

            font-size: 12.5px;
            font-weight: 800;

            box-shadow:
                0 6px 18px rgba(92, 138, 92, 0.18);

            transition:
                transform 0.15s ease,
                filter 0.2s ease;
        }

        .btn-pill:hover {
            filter: brightness(1.08);
        }

        .btn-pill:active {
            transform: scale(0.97);
        }

        /* =====================================================
           SWITCH LOGIN / SIGNUP
        ===================================================== */

        .switch-hint {
            text-align: center;

            margin-top: 25px;

            font-size: 11.5px;

            color: var(--ink-dim);
        }

        .switch-hint button {
            border: 0;
            background: none;

            cursor: pointer;

            color: var(--sage-2);

            font-family: inherit;
            font-size: 11.5px;
            font-weight: 700;
        }

        .switch-hint button:hover {
            text-decoration: underline;
        }

        /* =====================================================
           BOTTOM OAUTH
        ===================================================== */

        .oauth-section {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            min-height: 82px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-top:
                1px solid rgba(255, 255, 255, 0.10);

            background:
                rgba(0, 0, 0, 0.10);
        }

        .oauth-row {
            width: 100%;
            max-width: 370px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            font-size: 11px;

            color: var(--ink-dim);
        }

        .oauth-icons {
            display: flex;
            gap: 12px;
        }

        .oauth-circle {
            width: 34px;
            height: 34px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-size: 12px;
            font-weight: 800;

            border:
                1px solid var(--glass-border);

            background:
                rgba(255, 255, 255, 0.055);

            transition: 0.2s ease;
        }

        .oauth-circle:hover {
            background:
                rgba(255, 255, 255, 0.13);

            transform: translateY(-2px);
        }

        .oauth-circle.google,
        .oauth-circle.hub {
            color: #F3F7F5;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 720px) {

            body {
                padding: 20px 14px;
                overflow: auto;
            }

            .card {
                height: auto;
                min-height: 600px;

                grid-template-columns: 1fr;

                border-radius: 24px;
            }

            .panel-left {
                min-height: 145px;
            }

            .chevron-back {
                clip-path: polygon(
                    0 0,
                    75% 0,
                    40% 100%,
                    0 100%
                );
            }

            .chevron-front {
                clip-path: polygon(
                    10% 0,
                    85% 0,
                    48% 100%,
                    -10% 100%
                );
            }

            .brand {
                left: 22px;
                bottom: 20px;
            }

            .brand h1 {
                font-size: 18px;
            }

            .tabs {
                top: auto;
                bottom: 20px;
                right: 0;

                transform: none;
            }

            .tab.active {
                padding: 12px 28px 12px 20px;
            }

            .tab.inactive {
                padding: 12px 24px;
            }

            .panel-right {
                min-height: 500px;

                padding:
                    38px 25px 100px;
            }

            .oauth-section {
                min-height: 76px;
            }
        }

        /* =====================================================
           VERY SMALL SCREENS
        ===================================================== */

        @media (max-width: 420px) {

            .card {
                min-height: 570px;
            }

            .panel-left {
                min-height: 125px;
            }

            .avatar {
                width: 62px;
                height: 62px;
            }

            .form-block {
                max-width: 100%;
            }

            .oauth-row {
                padding: 0 25px;
            }
        }
    </style>
</head>


<body>

    <!-- Background -->

    <div class="blob b1"></div>
    <div class="blob b2"></div>


    <!-- Main Card -->

    <div class="card">

        <!-- =================================================
             LEFT PANEL
        ================================================== -->

        <div class="panel-left">

            <div class="chevron-back"></div>
            <div class="chevron-front"></div>

            <!-- Branding -->

            <div class="brand">
                <h1>FeedForward</h1>
                <p>Feedback intelligence</p>
            </div>


            <!-- Login / Signup Tabs -->

            <div class="tabs">

                <button
                    class="tab active"
                    id="tab-login"
                    type="button"
                    onclick="showForm('login')">

                    LOGIN

                </button>


                <button
                    class="tab inactive"
                    id="tab-signup"
                    type="button"
                    onclick="showForm('signup')">

                    SIGN UP

                </button>

            </div>

        </div>


        <!-- =================================================
             RIGHT PANEL
        ================================================== -->

        <div class="panel-right">

            <!-- User Icon -->

            <div class="avatar">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#0F1712"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path
                        d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2">
                    </path>

                    <circle
                        cx="12"
                        cy="7"
                        r="4">
                    </circle>

                </svg>

            </div>


            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <div
                class="form-block active"
                id="form-login">

                <h2>LOGIN</h2>


                <form id="loginForm">

                    <!-- Email -->

                    <div class="field">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2">

                            <path d="M22 6l-10 7L2 6"></path>

                            <path d="M2 6h20v12H2z"></path>

                        </svg>


                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Email"
                            autocomplete="email"
                            required>

                    </div>


                    <!-- Password -->

                    <div class="field">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2">

                            <rect
                                x="3"
                                y="11"
                                width="18"
                                height="10"
                                rx="2">
                            </rect>

                            <path
                                d="M7 11V7a5 5 0 0 1 10 0v4">
                            </path>

                        </svg>


                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Password"
                            autocomplete="current-password"
                            required>

                    </div>


                    <!-- Action -->

                    <div class="row-action">

                        <a href="#" onclick="return false;">
                            Forgot Password?
                        </a>


                        <button
                            type="submit"
                            class="btn-pill">

                            LOGIN

                        </button>

                    </div>

                </form>


                <!-- Switch -->

                <div class="switch-hint">

                    Don't have an account?

                    <button
                        type="button"
                        onclick="showForm('signup')">

                        Sign up

                    </button>

                </div>

            </div>


            <!-- =================================================
                 SIGN UP FORM
            ================================================== -->

            <div
                class="form-block"
                id="form-signup">

                <h2>SIGN UP</h2>


                <form id="signupForm">

                    <!-- Name -->

                    <div class="field">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2">

                            <path
                                d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2">
                            </path>

                            <circle
                                cx="12"
                                cy="7"
                                r="4">
                            </circle>

                        </svg>


                        <input
                            type="text"
                            id="signupName"
                            placeholder="Full name"
                            autocomplete="name"
                            required>

                    </div>


                    <!-- Email -->

                    <div class="field">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2">

                            <path d="M22 6l-10 7L2 6"></path>

                            <path d="M2 6h20v12H2z"></path>

                        </svg>


                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="Email"
                            autocomplete="email"
                            required>

                    </div>


                    <!-- Password -->

                    <div class="field">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2">

                            <rect
                                x="3"
                                y="11"
                                width="18"
                                height="10"
                                rx="2">
                            </rect>

                            <path
                                d="M7 11V7a5 5 0 0 1 10 0v4">
                            </path>

                        </svg>


                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Password"
                            autocomplete="new-password"
                            required>

                    </div>


                    <!-- Action -->

                    <div
                        class="row-action"
                        style="justify-content: flex-end;">

                        <button
                            type="submit"
                            class="btn-pill">

                            SIGN UP

                        </button>

                    </div>

                </form>


                <!-- Switch -->

                <div class="switch-hint">

                    Already have an account?

                    <button
                        type="button"
                        onclick="showForm('login')">

                        Log in

                    </button>

                </div>

            </div>


            <!-- =================================================
                 BOTTOM OAUTH
            ================================================== -->

            <div class="oauth-section">

                <div class="oauth-row">

                    <span>
                        Or Login With
                    </span>


                    <div class="oauth-icons">

                        <div
                            class="oauth-circle google"
                            onclick="oauthMessage('Google')">

                            G

                        </div>


                        <div
                            class="oauth-circle hub"
                            onclick="oauthMessage('GitHub')">

                            H

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         FRONTEND JAVASCRIPT ONLY
    ===================================================== -->

    <script>

        /*
         * LOGIN / SIGNUP TAB SWITCHING
         */

        function showForm(which) {

            const tabLogin =
                document.getElementById("tab-login");

            const tabSignup =
                document.getElementById("tab-signup");

            const formLogin =
                document.getElementById("form-login");

            const formSignup =
                document.getElementById("form-signup");


            if (which === "signup") {

                tabLogin.classList.remove("active");
                tabLogin.classList.add("inactive");

                tabSignup.classList.remove("inactive");
                tabSignup.classList.add("active");

                formLogin.classList.remove("active");
                formSignup.classList.add("active");

            } else {

                tabSignup.classList.remove("active");
                tabSignup.classList.add("inactive");

                tabLogin.classList.remove("inactive");
                tabLogin.classList.add("active");

                formSignup.classList.remove("active");
                formLogin.classList.add("active");

            }
        }


        /*
         * LOGIN FORM
         * Backend integration will be added later.
         */

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


            });


        /*
         * SIGN UP FORM
         * Backend integration will be added later.
         */

        document
            .getElementById("signupForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                

            });


        /*
         * GOOGLE / GITHUB PLACEHOLDER
         */

        

    </script>

</body>
</html>
